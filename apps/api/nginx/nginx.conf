upstream spotary_api {
    server localhost:8200;
}
upstream spotary_dashboard {
    server localhost:8201;
}
upstream spotary_adm {
    server localhost:8202;
}
server {
    listen 80;
    server_name spotary.place;
    add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
    add_header Cross-Origin-Embedder-Policy unsafe-none always;
    add_header Cross-Origin-Resource-Policy cross-origin always;
    # Frontend (Dashboard)
    location / {
        proxy_pass http://spotary_dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Backend API
    location /api/ {
        proxy_pass http://spotary_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    # Serve Images
    location /images/ {
        proxy_pass http://spotary_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # PWA Service Worker caching
    location ~* (sw\.js|service-worker\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        proxy_cache_bypass 1;
        expires off;
        proxy_pass http://spotary_dashboard;
        proxy_set_header Host $host;
    }
}
# Admin Dashboard
server {
    listen 80;
    server_name mod.spotary.place;
    location / {
        proxy_pass http://spotary_adm;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Backend API for Admin
    location /api/ {
        proxy_pass http://spotary_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}